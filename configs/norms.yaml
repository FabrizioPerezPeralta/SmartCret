version: "1.0"
standard: "NTP 339 / ACI 318 / E.060 Concreto Armado"

general_limits:
  min_cemento_kg: 280.0
  max_relacion_ac: 0.60
  min_total_binder_kg: 280.0
  max_total_binder_kg: 500.0
  min_sand_ratio: 0.36
  max_sand_ratio: 0.50
  air_content_pct: 2.0  # 20 L/m³ aire atrapado

replacement_limits:
  max_fly_ash_pct: 0.35     # ASTM C618 / ACI 318 límite máx 35%
  max_slag_pct: 0.50        # ASTM C989 máx 50%
  max_pozzolan_pct: 0.30    # NTP 334 máx 30%
  max_total_scm_pct: 0.50   # Máximo reemplazo total de clinker

exposure_classes:
  F0_normal:
    description: "Sin exposición severa, interior o protegido"
    max_relacion_ac: 0.55
    min_fc_mpa: 17.5
  F1_humedo:
    description: "Expuesto a humedad o congelamiento moderado"
    max_relacion_ac: 0.50
    min_fc_mpa: 28.0
  S1_sulfatos_moderado:
    description: "Exposición moderada a sulfatos (suelos o aguas salobres)"
    max_relacion_ac: 0.50
    min_fc_mpa: 28.0
    cement_type_preferred: "Tipo MS o Tipo IP"
  S2_sulfatos_severo:
    description: "Exposición severa a sulfatos"
    max_relacion_ac: 0.45
    min_fc_mpa: 31.0
    cement_type_preferred: "Tipo HS o Tipo V"

safety_margin:
  z_score_90: 1.28  # Margen estadístico sobre fc objetivo: f'cr = f'c + z * sigma
