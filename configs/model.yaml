version: "1.0"
experiment_name: "smartcret_baseline_v1"

features:
  numerical:
    - "cemento_kg"
    - "ceniza_volante_kg"
    - "escoria_kg"
    - "puzolana_kg"
    - "agua_kg"
    - "superplastificante_kg"
    - "agregado_grueso_kg"
    - "agregado_fino_kg"
    - "edad_dias"
    - "relacion_ac"
  categorical:
    - "tipo_cemento"

targets:
  - "resistencia_mpa"
  - "slump_mm"

cross_validation:
  n_splits: 5
  random_state: 42

models:
  baseline_ridge:
    type: "Ridge"
    alpha: 1.0

  random_forest:
    type: "RandomForest"
    n_estimators: 100
    max_depth: 12
    random_state: 42

  gradient_boosting:
    type: "HistGradientBoosting"
    max_iter: 150
    learning_rate: 0.08
    max_leaf_nodes: 31
    random_state: 42

uncertainty:
  method: "conformal_residual_quantile"
  confidence_level: 0.90  # 90% prediction interval (5% lower, 95% upper)
